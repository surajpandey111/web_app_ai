<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-HUB</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #343541;
            color: #ececf1;
        }
        .chat-wrapper {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 260px;
            background-color: #202123;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
            overflow: hidden;
        }
        .sidebar.collapsed {
            width: 60px;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #565869;
        }
        .sidebar-header h2 {
            margin: 0;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toggle-sidebar {
            background: none;
            border: none;
            color: #ececf1;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }
        .new-chat {
            padding: 16px;
        }
        .new-chat button {
            width: 100%;
            padding: 10px;
            background-color: #343541;
            color: #ececf1;
            border: 1px solid #565869;
            border-radius: 6px;
            cursor: pointer;
        }
        .history-section {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px;
        }
        .history-section h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #8e8ea0;
        }
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #343541;
        }
        .conversation {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background-color: #10a37f;
            color: white;
        }
        .bot-message {
            align-self: flex-start;
            background-color: #444654;
            color: #ececf1;
        }
        .input-area {
            padding: 16px;
            border-top: 1px solid #565869;
            background-color: #40414f;
        }
        .form-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-input {
            display: flex;
            gap: 10px;
            flex: 1;
            min-width: 200px;
        }
        .form-input input[type="text"] {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 24px;
            background-color: #40414f;
            color: #ececf1;
        }
        .form-input input[type="file"] {
            padding: 8px;
            background-color: #565869;
            color: #ececf1;
            border: none;
            border-radius: 6px;
        }
        .form-input button {
            padding: 12px 20px;
            background-color: #10a37f;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
        }
        #gate-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        .gate {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background-color: #343541;
        }
        #gate-left {
            left: 0;
            transform-origin: left;
        }
        #gate-right {
            right: 0;
            transform-origin: right;
        }
        #welcome-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #ececf1;
            z-index: 101;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
        }
        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            max-height: 80%;
        }
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #202123;
            color: #8e8ea0;
        }
        #image-preview {
            max-width: 100px;
            max-height: 100px;
            display: none;
            margin-left: 10px;
        }
        @media (max-width: 768px) {
            .chat-wrapper {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: absolute;
                z-index: 50;
                top: 0;
                left: 0;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar.collapsed {
                transform: translateX(-100%);
            }
            .toggle-sidebar {
                position: fixed;
                top: 10px;
                left: 10px;
                z-index: 60;
                background-color: #202123;
                border: 1px solid #565869;
                padding: 8px;
                border-radius: 4px;
            }
            .main-chat {
                width: 100%;
                order: 2;
            }
            .conversation {
                padding: 16px;
                height: calc(100vh - 120px);
            }
            .input-area {
                padding: 12px 16px;
            }
            .form-container {
                flex-direction: column;
                gap: 8px;
            }
            #chat-form .form-input {
                flex-direction: row;
                align-items: center;
            }
            #chat-form .form-input input[type="text"] {
                flex: 1;
                min-width: 0;
            }
            #upload-form .form-input {
                flex-direction: column;
                gap: 5px;
                align-items: stretch;
            }
            #upload-form .form-input input[type="text"] {
                width: 100%;
                border-radius: 16px;
            }
            #upload-form .form-input input[type="file"] {
                width: 100%;
                border-radius: 6px;
            }
            #upload-form .form-input button {
                width: 100%;
                border-radius: 24px;
            }
            #image-preview {
                max-width: 80px;
                max-height: 80px;
                display: block;
                margin: 5px auto 0;
            }
            footer {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                padding: 5px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="gate-container">
        <div id="gate-left" class="gate"></div>
        <div id="gate-right" class="gate"></div>
        <div id="welcome-text">AI-HUB</div>
    </div>
            
    <div class="chat-wrapper">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>AI-HUB</h2>
                <button class="toggle-sidebar" id="toggle-sidebar">☰</button>
            </div>
            <div class="new-chat">
                <button type="button">New Chat</button>
            </div>
            <div class="history-section">
                <h3>History</h3>
                <div id="chat-history-list">
                    <!-- Past chat sessions can be listed here dynamically -->
                </div>
            </div>
        </div>
        <div class="main-chat">
            <div class="conversation" id="conversation">
                {% for entry in chat_history %}
                <div class="message user-message">{{ entry.user }}</div>
                <div class="message bot-message">{{ entry.bot }}</div>
                {% endfor %}
            </div>
            <div class="input-area">
                <div class="form-container">
                    <form id="chat-form" class="form-input">
                        <input type="text" name="prompt" id="prompt" placeholder="Enter your prompt here" required>
                        <button type="submit">Ask</button>
                    </form>
                    <form id="upload-form" class="form-input" enctype="multipart/form-data">
                        <input type="text" name="prompt" id="upload-prompt" placeholder="Enter your prompt here" required>
                        <input id="file-input" type="file" name="file" accept="image/*">
                        <img id="image-preview" alt="Preview">
                        <button type="submit">Ask with Image</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div id="image-modal" class="modal">
        <span class="close" id="close-modal">&times;</span>
        <img class="modal-content" alt="Image preview">
    </div>
    <footer>
        <p>Developed by Suraj</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatForm = document.getElementById('chat-form');
            const uploadForm = document.getElementById('upload-form');
            const conversation = document.getElementById('conversation');
            const fileInput = document.getElementById('file-input');
            const imagePreview = document.getElementById('image-preview');
            const imageModal = document.getElementById('image-modal');
            const closeModal = document.getElementById('close-modal');
            const gateContainer = document.getElementById('gate-container');
            const toggleSidebar = document.getElementById('toggle-sidebar');
            const sidebar = document.getElementById('sidebar');
            const newChatBtn = document.querySelector('.new-chat button');

            // Scroll to bottom initially
            conversation.scrollTop = conversation.scrollHeight;

            // Gate animation
            setTimeout(() => {
                document.getElementById('gate-left').style.transform = 'rotateY(-90deg)';
                document.getElementById('gate-right').style.transform = 'rotateY(90deg)';
            }, 1000);
            setTimeout(() => {
                gateContainer.style.display = 'none';
            }, 2000);

            // Toggle sidebar
            toggleSidebar.addEventListener("click", function() {
                sidebar.classList.toggle("open");
            });

            // Close sidebar on outside click for mobile
            document.addEventListener('click', function(event) {
                if (window.innerWidth <= 768 && !sidebar.contains(event.target) && !toggleSidebar.contains(event.target)) {
                    sidebar.classList.remove("open");
                }
            });

            // New chat
            newChatBtn.addEventListener('click', function() {
                conversation.innerHTML = '';
            });

            // Chat form submission
            chatForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const formData = new FormData(chatForm);
                try {
                    const response = await fetch("/generate", {
                        method: "POST",
                        body: formData
                    });
                    if (!response.ok) throw new Error('Network response was not ok');
                    const data = await response.json();
                    appendMessage(data.user, 'user-message');
                    appendMessage(data.bot, 'bot-message');
                    chatForm.reset();
                    conversation.scrollTop = conversation.scrollHeight;
                } catch (error) {
                    console.error('Error:', error);
                    appendMessage('Error generating response', 'bot-message');
                }
            });

            // File input preview
            fileInput.addEventListener("change", () => {
                const file = fileInput.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        imagePreview.src = e.target.result;
                        imagePreview.style.display = "block";
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Upload form submission
            uploadForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const formData = new FormData(uploadForm);
                try {
                    const response = await fetch("/generate_with_image", {
                        method: "POST",
                        body: formData
                    });
                    if (!response.ok) throw new Error('Network response was not ok');
                    const data = await response.json();
                    appendMessage(data.user, 'user-message');
                    appendMessage(data.bot, 'bot-message');
                    uploadForm.reset();
                    imagePreview.style.display = "none";
                    conversation.scrollTop = conversation.scrollHeight;
                } catch (error) {
                    console.error('Error:', error);
                    appendMessage('Error generating response with image', 'bot-message');
                }
            });

            function appendMessage(text, className) {
                const messageDiv = document.createElement("div");
                messageDiv.className = `message ${className}`;
                messageDiv.textContent = text;
                conversation.appendChild(messageDiv);
                conversation.scrollTop = conversation.scrollHeight;
            }

            // Modal
            closeModal.onclick = function() {
                imageModal.style.display = "none";
            };
            window.onclick = function(event) {
                if (event.target == imageModal) {
                    imageModal.style.display = "none";
                }
            };
        });
    </script>
</body>
</html>
