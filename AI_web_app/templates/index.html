<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyanm-The DeepAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <script defer src="{{ url_for('static', filename='js/scripts.js')}}"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        #scroll-button {
            position: fixed;
            right: 10px;
            bottom: 20px;
            background-color:rgb(230, 112, 16);
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1000;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
        }
        .questions-container {
            width: 100%;
            padding: 10px;
            border-bottom: 2px solid #ccc;
        }
        .answers-container {
            width: 100%;
            padding: 10px;
        }
        .goto-answer {
            display: block;
            margin-top: 5px;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <button id="scroll-button">Please Scroll Down for Answer</button>
    <div id="gate-container">
        <div id="gate-left" class="gate"></div>
        <div id="gate-right" class="gate"></div>
        <div id="welcome-text">Gyanm-The DeepAI</div>
    </div>
            
    <div class="container">
        <h1>Gyanm-The DeepAI</h1>
        <div class="form-container">
            <form id="chat-form" class="form-input">
                <input type="text" name="prompt" id="prompt" placeholder="Enter your prompt here" required>
                <button type="submit">Ask</button>
            </form>
            <form id="upload-form" class="form-input" enctype="multipart/form-data">
                <input type="text" name="prompt" id="upload-prompt" placeholder="Enter your prompt here" required>
                <input id="file-input" type="file" name="file" accept="image/*">
                <button type="submit">Ask with Image</button>
            </form>
        </div>
        <h2>SERVICES</h2>
        <div id="chat-history">
            {% for entry in chat_history %}
            <div class="chat-entry">
                <p><strong>You:</strong> {{ entry.user }}</p>
                <p><strong>AI:</strong><pre>{{ entry.bot }}</pre></p>
                </div>
            {% endfor %}
        </div>
    </div>
    <div id="image-modal" class="modal">
        <span class="close" id="close-modal">&times;</span>
        <img class="modal-content" alt="Image preview">
    </div>
    <footer>
        <p>Developed by Suraj</p>
    </footer>
    <script>
        document.getElementById("scroll-button").addEventListener("click", function() {
            document.getElementById("chat-history").scrollIntoView({ behavior: "smooth" });
        });

        document.querySelectorAll(".goto-answer").forEach(button => {
            button.addEventListener("click", function() {
                let targetId = this.getAttribute("data-target");
                document.getElementById(targetId).scrollIntoView({ behavior: "smooth" });
            });
        });
    </script>
</body>
</html>
